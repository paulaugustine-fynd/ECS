name: ati-ecs-demo
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecs
      POSTGRES_PASSWORD: ecs_local_only
      POSTGRES_DB: ecs_demo
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecs -d ecs_demo"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ecs_local
      MINIO_ROOT_PASSWORD: ecs_local_storage_only
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
volumes:
  postgres-data:
  redis-data:
  minio-data:
